name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Cache pinned test FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cwb-test-ffmpeg
          key: ffmpeg-8.0.1-windows-x64-467cde100a47
      - name: Prepare pinned test FFmpeg
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'cwb-test-ffmpeg'
          $binary = Join-Path $directory 'ffmpeg-8.0.1-full_build/bin/ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-8.0.1-full_build.zip'
            Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/8.0.1/ffmpeg-8.0.1-full_build.zip' -OutFile $archive
            $expected = '467cde100a47ed4b03a897988aeb4a296890c1e2b2d2864204657d002bc5fb90'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
              throw 'FFmpeg archive checksum mismatch'
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $directory -ErrorAction Stop
          }
          "CODEX_WALLPAPER_FFMPEG=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary -version
          if ($LASTEXITCODE -ne 0) { throw 'Test FFmpeg is not executable' }
      - run: npm test
      - name: Installer and startup policy regressions
        if: matrix.node == 24
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('launch-policy','startup-health','install-options','install-upgrade','install-dependencies','update-reconnect','remote-bootstrap')) {
            & "./test/$test.ps1"
          }
          & ./test/install-runtime.ps1 -ScratchDirectory (Join-Path $env:RUNNER_TEMP 'cwb-runtime-path-test')
      - run: npm run check:privacy
